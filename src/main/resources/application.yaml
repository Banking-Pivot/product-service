spring:
  application:
    name: product-service

  # Port, MongoDB and Redis locations and the cache lifetime come from the Config Server:
  # banking-config/product-service.yml and product-service-<profile>.yml. Secrets (the MongoDB
  # user and password and the Redis password) come from Vault: secret/product-service and
  # secret/product-service/<profile>. Where Eureka is comes from banking-config/application.yml:
  # the service registers there as product-service.
  config:
    import:
      - "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
      # Role ID and secret ID of this service's AppRole. In local development infra/vault
      # writes this file every time Vault starts; elsewhere point VAULT_APPROLE_FILE to the
      # file, or set SPRING_CLOUD_VAULT_APP_ROLE_ROLE_ID and SPRING_CLOUD_VAULT_APP_ROLE_SECRET_ID.
      - "optional:file:${VAULT_APPROLE_FILE:../infra/.secrets/product-service.properties}"
      - "vault://"

  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      # Without its secrets the service cannot reach its database: stop at startup with the
      # Vault error instead of failing later on a login to MongoDB.
      fail-fast: true
      kv:
        # Read only this service's paths, not the shared secret/application.
        default-context: ""

  reactor:
    # The correlation id of a request reaches the logs of every thread that serves it.
    context-propagation: auto

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    # The contract omits the terms that do not apply to a product instead of sending null.
    default-property-inclusion: non_null

  data:
    redis:
      repositories:
        # Redis is only the product cache; the repositories of this service are MongoDB's.
        enabled: false

# Swagger UI shows the contract itself (served by OpenApiContractConfiguration),
# not the spec springdoc derives from the generated annotations.
springdoc:
  swagger-ui:
    url: /openapi/product-api.yml
